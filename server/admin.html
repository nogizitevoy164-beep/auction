<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>Auction Admin</title><style>body{font:16px sans-serif;max-width:900px;margin:2rem auto;background:#16151e;color:#eee}input,button{padding:.55rem;margin:.25rem;background:#282638;color:#fff;border:1px solid #625a85}button{cursor:pointer}.item{border:1px solid #45405d;padding:.6rem;margin:.4rem 0}</style></head>
<body>
<h1>Панель администратора Auction</h1>
<p>Ключ разработки: <input id="key" value="dev-admin-key" type="password"></p>
<h2>Создать или изменить предмет</h2>
<input id="id" placeholder="id"><input id="name" placeholder="Название"><input id="cost" placeholder="Стоимость" type="number">
<input id="starter" placeholder="Шанс starter" type="number" step="0.01"><input id="mid" placeholder="Шанс mid" type="number" step="0.01"><input id="elite" placeholder="Шанс elite" type="number" step="0.01">
<button onclick="saveItem()">Сохранить</button><button onclick="loadItems()">Обновить</button>
<div id="items"></div>
<script>
async function loadItems(){const r=await fetch('/api/v1/catalog/items');const d=await r.json();items.innerHTML=d.items.map(x=>`<div class="item"><b>${x.id}</b> — ${x.name}, ${x.baseCost} монет; шансы: ${x.chances.starter}/${x.chances.mid}/${x.chances.elite}</div>`).join('')}
async function saveItem(){const body={id:id.value,name:name.value,baseCost:Number(cost.value),chances:{starter:Number(starter.value),mid:Number(mid.value),elite:Number(elite.value)}};const r=await fetch('/api/v1/admin/items',{method:'POST',headers:{'content-type':'application/json','x-admin-key':key.value},body:JSON.stringify(body)});alert((await r.json()).error||'Сохранено');loadItems()}
loadItems();
</script></body></html>
